apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: planning-poker-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: planning-poker-repo
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/midasf/self-host-planning-poker
        username: midasf
        password: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: planning-poker/argocd-repo
        property: token
