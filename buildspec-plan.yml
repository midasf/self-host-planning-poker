version: 0.2

env:
  variables:
    TF_VERSION: "1.15.8"

phases:
  install:
    commands:
      - curl -sSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o terraform.zip
      - unzip -q terraform.zip -d /usr/local/bin
      - rm terraform.zip
      - terraform version

  pre_build:
    commands:
      - cd infra
      - >-
        terraform init
        -backend-config="bucket=${TF_STATE_BUCKET}"
        -backend-config="key=planning-poker/terraform.tfstate"
        -backend-config="region=${AWS_REGION}"
        -backend-config="use_lockfile=true"
        -backend-config="encrypt=true"
        -input=false
      - terraform validate

  build:
    commands:
      - >-
        terraform plan
        -var="aws_region=${AWS_REGION}"
        -var="target_account_id=${TARGET_ACCOUNT_ID}"
        -var="target_account_role=${TARGET_ACCOUNT_ROLE}"
        -var="lambda_reserved_concurrency=${LAMBDA_RESERVED_CONCURRENCY:--1}"
        -out=tfplan
        -input=false

artifacts:
  files:
    - "**/*"
  discard-paths: no
