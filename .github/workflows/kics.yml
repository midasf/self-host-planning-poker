name: KICS Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kics-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Run KICS scan
        uses: Checkmarx/kics-github-action@master
        with:
          path: '.'
          output_formats: 'sarif'
          output_path: 'kics-results'
          exclude_paths: '.git,.github'
          fail_on: 'high,critical'
          # The action's node-based annotations/summary crash on the runner
          # (GLIBC mismatch); the Go scan + SARIF still run. Disable them.
          enable_annotations: false
          enable_jobs_summary: false
