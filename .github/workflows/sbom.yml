name: SBOM

on:
  push:
    branches: [main]

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Python SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements aws/src/requirements.txt -o sbom-api.json

      - name: Upload Python SBOM
        run: |
          curl -sf --max-time 30 \
            -X POST "https://dtrack.home.hacktheplanet.nl/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DT_API_KEY }}" \
            -F "autoCreate=true" \
            -F "projectName=planning-poker-api" \
            -F "projectVersion=main" \
            -F "bom=@sbom-api.json"

      - name: Generate Node SBOM
        working-directory: angular
        run: npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-file ../sbom-frontend.json

      - name: Upload Node SBOM
        run: |
          curl -sf --max-time 30 \
            -X POST "https://dtrack.home.hacktheplanet.nl/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DT_API_KEY }}" \
            -F "autoCreate=true" \
            -F "projectName=planning-poker-frontend" \
            -F "projectVersion=main" \
            -F "bom=@sbom-frontend.json"
