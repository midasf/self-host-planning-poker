apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: planning-poker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/midasf/self-host-planning-poker
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: planning-poker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
